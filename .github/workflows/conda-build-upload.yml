name: conda-build-upload
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build-conda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conda-build & anaconda-client
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          activate-environment: base
          channels: razinka,conda-forge
          conda-remove-defaults: "true"
          miniforge-version: latest
      - shell: bash -l {0}
        run: |
          conda install -n base -y -c conda-forge conda-build anaconda-client pip
          conda build conda.recipe -c razinka -c conda-forge
          OUT=$(conda build conda.recipe -c razinka -c conda-forge --output)
          echo "CONDA_OUT=$OUT" >> $GITHUB_ENV
      - name: Upload to Anaconda.org
        if: env.CONDA_OUT != ''
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda -t "$ANACONDA_API_TOKEN" upload "$CONDA_OUT" --label main
