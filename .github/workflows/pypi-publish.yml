name: pypi-publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.published.outputs.version }}
      exists: ${{ steps.published.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyPI rejects a re-upload of an existing file, so a manual run after the
      # release run (or the reverse) would go red. Skip when the version is
      # already on PyPI, as the conda workflow does for anaconda.org.
      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/shiny_deckgl/_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/shiny-deckgl/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "shiny-deckgl $VERSION is already on PyPI; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build sdist and wheel
        if: steps.published.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check dist/*
      # The wheel is useless without the browser runtime it ships; fail here
      # rather than publish a package that renders nothing.
      - name: Check the wheel bundles the runtime files
        if: steps.published.outputs.exists != 'true'
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["shiny_deckgl/resources/deckgl-init.js", "shiny_deckgl/py.typed"]
          missing = [n for n in need if n not in names]
          sys.exit(f"wheel is missing {missing}" if missing else 0)
          EOF
      - uses: actions/upload-artifact@v4
        if: steps.published.outputs.exists != 'true'
        with:
          name: pypi-dist
          path: dist/*

  publish:
    needs: build
    if: needs.build.outputs.exists != 'true'
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token is stored in GitHub. PyPI must
    # have this repository, workflow file and environment name registered as
    # a publisher for the project (Manage -> Publishing).
    environment:
      name: pypi
      url: https://pypi.org/project/shiny-deckgl/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
