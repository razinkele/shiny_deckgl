name: python-package
on:
  push:
    # Release and fix branches are tested before they reach main, so a merge
    # never turns main red for something the branch could have caught.
    branches: [ main, 'release/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The Node harness tests (tests/_js_harness.py) need node; pin it rather
      # than rely on whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --version
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -m "not browser" --benchmark-disable
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/*

  # The browser tests, one module at a time (each serves its own small Shiny
  # app and drives a real Chromium against the CDN bundles). Until 1.12.2
  # these were skipped in CI for lack of Playwright, which is how a
  # pointer-events regression shipped: SHINY_DECKGL_REQUIRE_BROWSER turns a
  # browser that fails to launch into a failure instead of a skip.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHINY_DECKGL_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Browser modules, one file at a time
        shell: bash
        run: |
          set -e
          for f in tests/test_e2e_legend_click.py tests/test_e2e_widget_events.py \
                   tests/test_e2e_style_queue.py tests/test_e2e_startup_style.py \
                   tests/test_e2e_render_race.py tests/test_e2e_rerender.py \
                   tests/test_e2e_viewport.py tests/test_e2e_trips.py \
                   tests/test_e2e_frame_loop.py tests/test_e2e_globe.py \
                   tests/test_sanitizer_browser.py tests/test_widgets_resolve.py \
                   tests/test_maplibre_v6.py; do
            echo "::group::$f"; pytest -q "$f"; echo "::endgroup::"
          done
      # The full demo (11 maps) is the heavy one: last and alone.
      - run: pytest -q tests/test_e2e_playwright.py
