{% set name = "shiny-deckgl" %}
# Read version automatically from the single source of truth
{% set data = load_file_regex(load_file="src/shiny_deckgl/_version.py", regex_pattern='__version__ = "(?P<version>[^"]+)"') %}
{% set version = data.version %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  path: ..

build:
  noarch: python
  number: 0
  entry_points:
    - shiny_deckgl-demo = shiny_deckgl.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - shiny >=1.6.3
    - htmltools

# Build-time verification of the *packaged* result, not the source tree.
#
# The package installs cleanly even if the client assets are missing -- there is
# no import error, every map simply fails to load in the browser -- so the asset
# checks below use importlib.resources to look inside the installed package.
# The version check catches a recipe built from a stale source tree.
test:
  imports:
    - shiny_deckgl
  requires:
    - pip
  commands:
    - python -c "from shiny_deckgl._version import __version__ as v; assert v == '{{ version }}', v"
    - python -c "from importlib.resources import files; r = files('shiny_deckgl.resources'); assert (r / 'deckgl-init.js').is_file(), 'deckgl-init.js missing'; assert (r / 'styles.css').is_file(), 'styles.css missing'"
    - python -c "from importlib.resources import files; assert (files('shiny_deckgl.data') / 'helcom_mpa.geojson').is_file(), 'geojson missing'"
    - python -c "from shiny_deckgl import head_includes; assert 'deckgl-init.js' in str(head_includes())"
    - python -c "from shiny_deckgl.cli import main; assert callable(main)"
    - pip check

about:
  home: "https://github.com/razinka/shiny_deckgl"
  license: "MIT"
  license_file: LICENSE
  summary: "Shiny for Python -> deck.gl bridge (no Java) with packaged assets"
  description: |
    A lightweight library for integrating deck.gl (v9.4.0) and
    MapLibre GL JS (v6.7.0) into Shiny for Python applications.
    Built for marine science and GIS visualisation.
  doc_url: "https://github.com/razinka/shiny_deckgl/blob/main/docs/api_reference.md"
  dev_url: "https://github.com/razinka/shiny_deckgl"

extra:
  recipe-maintainers:
    - razinka
